[project]
name = "cimiento-agents"
version = "0.1.0"
description = "Cimiento agents service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "psycopg[binary]>=3.2",
    "pypdf>=5.1",
    "numpy>=1.26",
    "fastembed>=0.9",
    "anthropic>=0.75",
    "httpx>=0.27",
    "confluent-kafka>=2.6",
]

[project.scripts]
cimiento-agents = "cimiento_agents.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimiento_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format enforces code width; long SQL, prompt and report strings stay readable
ignore = ["E501"]
