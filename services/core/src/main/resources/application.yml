spring:
  application:
    name: cimiento-core
  datasource:
    url: ${CIMIENTO_DB_URL:jdbc:postgresql://localhost:5432/cimiento}
    username: ${POSTGRES_USER:cimiento}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      # three tender PDFs of up to 20 MB each (ADR 0018)
      max-file-size: 20MB
      max-request-size: 64MB
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

cimiento:
  keys:
    agent: ${CIMIENTO_AGENT_KEY:}
    analyst: ${CIMIENTO_ANALYST_KEY:}
    reviewer: ${CIMIENTO_REVIEWER_KEY:}
  # People who decide in the console: JSON array of {username, displayName, role, tokenHash}.
  people: ${CIMIENTO_PEOPLE:}
  outbox:
    # Publish audit events to Kafka (cimiento.audit). Off by default: the outbox table still fills.
    enabled: ${CIMIENTO_OUTBOX_ENABLED:false}
  certification:
    # Fictional, configurable: retention taken on each period, VAT on what is left (percent).
    retention-pct: ${CIMIENTO_RETENTION_PCT:5}
    vat-pct: ${CIMIENTO_VAT_PCT:21}
  review:
    # Budgets at or above this amount (EUR, VAT excluded) always need a person.
    amount-threshold-eur: 1000000

management:
  endpoints:
    web:
      exposure:
        include: health
