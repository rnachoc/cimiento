[project]
name = "cimiento-mcp"
version = "0.1.0"
description = "Cimiento mcp service"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]

[project.scripts]
cimiento-mcp = "cimiento_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimiento_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
