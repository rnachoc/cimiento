name: cimiento

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cimiento}
      POSTGRES_USER: ${POSTGRES_USER:-cimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Application profile: `docker compose --profile app up --build` (used by `make e2e`).
  core:
    profiles: ["app"]
    build: ../services/core
    environment:
      CIMIENTO_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cimiento}
      POSTGRES_USER: ${POSTGRES_USER:-cimiento}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      CIMIENTO_AGENT_KEY: ${CIMIENTO_AGENT_KEY:?set CIMIENTO_AGENT_KEY}
      CIMIENTO_ANALYST_KEY: ${CIMIENTO_ANALYST_KEY:?set CIMIENTO_ANALYST_KEY}
      CIMIENTO_REVIEWER_KEY: ${CIMIENTO_REVIEWER_KEY:?set CIMIENTO_REVIEWER_KEY}
    ports:
      - "${CORE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  console:
    profiles: ["app"]
    build: ../web/console
    environment:
      CORE_URL: http://core:8080
      CIMIENTO_REVIEWER_KEY: ${CIMIENTO_REVIEWER_KEY:?set CIMIENTO_REVIEWER_KEY}
    ports:
      - "${CONSOLE_PORT:-8088}:8080"
    depends_on:
      - core

volumes:
  pgdata:
