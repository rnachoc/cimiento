[project]
name = "cimiento-data"
version = "0.1.0"
description = "Cimiento synthetic data generator with ground truth"
requires-python = ">=3.12,<3.13"
dependencies = ["networkx>=3.4", "fpdf2>=2.8"]

[project.scripts]
cimiento-data = "cimiento_data.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8", "pypdf>=5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimiento_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
