[project]
name = "cimiento-evals"
version = "0.1.0"
description = "Cimiento evaluations against synthetic ground truth"
requires-python = ">=3.12,<3.13"
dependencies = ["cimiento-agents"]

[project.scripts]
cimiento-evals = "cimiento_evals.cli:main"

[tool.uv.sources]
cimiento-agents = { path = "../services/agents", editable = true }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimiento_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# ruff format enforces code width; long SQL, prompt and report strings stay readable
ignore = ["E501"]
